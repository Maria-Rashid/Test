<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hey Maria 🌸</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ffe0e9, #c2f0ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.7);
      padding: 2rem;
      border-radius: 2rem;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      font-size: 2.5rem;
      color: #ff3e6c;
    }

    p {
      font-size: 1.2rem;
      margin-top: 1rem;
      color: #333;
    }

    button {
      margin-top: 2rem;
      padding: 0.6rem 1.4rem;
      border: none;
      background-color: #ff3e6c;
      color: white;
      border-radius: 1rem;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .reply {
      margin-top: 1.5rem;
      font-style: italic;
      color: #555;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .reply.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hey Maria 👋</h1>
    <p>How are you doing today?</p>
    <button onclick="showReply()">Click me</button>
    <p class="reply" id="reply">You are doing amazing — don’t forget that! 🌻</p>
  </div>

  <script>
    function showReply() {
      const reply = document.getElementById("reply");
      reply.classList.add("show");
    }
  </script>
</body>
</html>
